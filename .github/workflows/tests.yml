name: Universal Skill Tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q engine scripts tests

      - name: Check manifest OOS runner interface
        run: python scripts/evaluate_dataset_manifest_oos.py --help

      - name: Check manifest OOS uncertainty analyzer interface
        run: python scripts/analyze_manifest_oos_uncertainty.py --help

      - name: Check confirmatory OOS runner interface
        run: python scripts/run_confirmatory_oos.py --help

      - name: Check futures roll audit interface
        run: python scripts/audit_futures_roll.py --help

      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -v
