name: 200K Paths Performance and Convergence

on:
  push:
    branches: [feature/v2.3.0]
    paths:
      - "engine/**"
      - "scripts/benchmark_200k.py"
      - "tests/**"
      - ".github/workflows/benchmark-200k.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: 200K streamed performance and convergence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.3.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v
      - name: Run dedicated 200K benchmark
        run: python scripts/benchmark_200k.py --output 200k_benchmark_report.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: 200k-performance-convergence-report
          path: 200k_benchmark_report.json
          if-no-files-found: error
          retention-days: 30