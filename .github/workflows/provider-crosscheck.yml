name: Independent Data Provider Check

on:
  push:
    branches: [feature/v2.3.0]
    paths:
      - "scripts/check_independent_provider.py"
      - "scripts/evaluate_multi_market_oos.py"
      - ".github/workflows/provider-crosscheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.3.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run live independent-provider check
        run: python scripts/check_independent_provider.py
      - name: Upload provider report
        uses: actions/upload-artifact@v4
        with:
          name: independent-provider-report
          path: provider_crosscheck_report.json
          if-no-files-found: error
          retention-days: 30