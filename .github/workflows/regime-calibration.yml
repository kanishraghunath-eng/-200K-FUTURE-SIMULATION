name: Historical Regime Calibration

on:
  push:
    branches: [feature/v2.3.0]
    paths:
      - "engine/**"
      - "scripts/evaluate_regime_calibration.py"
      - ".github/workflows/regime-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regime-calibration:
    name: Actual engine evaluation across market regimes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.3.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run actual engine on historical regimes
        run: |
          python scripts/evaluate_regime_calibration.py --paths 1000 --output regime_calibration_report.json

      - name: Upload regime report
        uses: actions/upload-artifact@v4
        with:
          name: regime-calibration-report
          path: regime_calibration_report.json
          if-no-files-found: error
          retention-days: 14
